    .stat span { color: var(--muted); font-size: 12px; }

    label { display: block; font-size: 13px; font-weight: 600; margin: 16px 0 6px; }

      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--panel);
      color: var(--ink);

    input, select { width: 100%; padding: 9px 10px; }
    button { padding: 8px 10px; cursor: pointer; }
    .layer-list { display: grid; gap: 6px; margin-top: 8px; }
    .check { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
    .check input { width: auto; }
    .legend { margin-top: 18px; display: grid; gap: 8px; }
    .legend-row { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
    .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    #graph-area { position: relative; min-height: 720px; }
    svg { width: 100%; height: 100%; min-height: 720px; display: block; }
    .link { stroke: rgba(91, 84, 70, .32); stroke-width: 1.2; }
    .node circle { stroke: rgba(29,37,36,.7); stroke-width: .8; }
    .node text { font-size: 11px; fill: var(--ink); paint-order: stroke; stroke: rgba(247,244,237,.85); stroke-width: 4px; stroke-linejoin: round; pointer-events: none; }
    .node.faded, .link.faded { opacity: .12; }
    .node.selected circle { stroke: #111; stroke-width: 2.2; }
    .pill { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 4px 8px; margin: 3px 4px 3px 0; color: var(--muted); font-size: 12px; background: var(--panel); }
    .detail h2 { margin: 4px 0 8px; font-size: 22px; }
    .detail p { color: var(--muted); line-height: 1.58; }
    .section-title { margin-top: 20px; font-weight: 700; }

    .tour button { text-align: left; }
    a { color: var(--accent); }

nloaded_pdfs": 19, "categories": {"综述与路线图": 169, "地球物理解释与反演": 62, "遥感、高光谱与蚀变/岩性识别": 95, "地球化学异常识别": 35, "矿产远景区预测与靶区优选": 104, "通用 AI/ML 地学应用": 158, "基础模型、知识图谱与文档智能": 7, "图学习与空间关系建模": 4, "钻孔、岩心与矿体表征": 5}, "top_technologies": {"Machine learning": 341, "Deep learning": 147, "Random Forest": 124, "Support Vector Machine": 91, "Convolutional Neural Network": 74, "Exploration target ranking": 63, "Supervised learning": 48, "Attention mechanism": 48, "Ensemble learning": 45, "Multilayer Perceptron / ANN": 45, "ROC-AUC / PR-AUC": 43, "Gradient Boosting": 41, "Multi-source data fusion": 38, "XGBoost": 36, "Drilling recommendation": 28, "Logistic Regression": 27, "Principal Component Analysis": 26, "Transformer": 26, "GIS overlay modeling": 26, "Unsupervised learning": 26}, "top_tasks": {"Mineral prospectivity mapping": 174, "Remote sensing mineral/alteration mapping": 133, "Hyperspectral/lithology mapping": 120, "Geophysical inversion and interpretation": 95, "Portfolio and target ranking": 68, "Ore deposit classification": 55, "Geochemical anomaly detection": 44, "Drill core logging and assay prediction": 26, "Exploration knowledge management": 13}}};
    const colors = {
      data: "#4d8b6f",
      feature: "#b1881f",
      model: "#7357a6",
      task: "#176d6a",
      decision: "#b84f32",
      company: "#2f6f9f",
      paper: "#77746d",
      category: "#8b6f47"
    };
    const svg = d3.select("#graph");
    const area = document.getElementById("graph-area");
    const layerBox = document.getElementById("layers");
    const relationSelect = document.getElementById("relation");
    const searchInput = document.getElementById("search");
    const detail = document.getElementById("detail");
    const activeLayers = new Set(Object.keys(graph.layers));
    let selectedId = null;
    let simulation;

    Object.entries(graph.layers).forEach(([key, label]) => {
      const row = document.createElement("label");
      row.className = "check";
      row.innerHTML = `<input type="checkbox" checked value="${key}"> <span>${label}</span>`;
      row.querySelector("input").addEventListener("change", (e) => {
        e.target.checked ? activeLayers.add(key) : activeLayers.delete(key);
        draw();
      });
      layerBox.appendChild(row);
    });

    [...new Set(graph.edges.map(e => e.relation))].sort().forEach(rel => {
      const option = document.createElement("option");
      option.value = rel;
      option.textContent = rel;
      relationSelect.appendChild(option);
    });

    document.getElementById("legend").innerHTML = Object.entries(graph.layers)
      .map(([key,label]) => `<div class="legend-row"><span class="dot" style="background:${colors[key]}"></span>${label}</div>`).join("");

    document.getElementById("top-tech").innerHTML = Object.entries(graph.stats.top_technologies).slice(0, 10)
      .map(([name, count]) => `<tr><td>${name}</td><td>${count}</td></tr>`).join("");

    searchInput.addEventListener("input", draw);
    relationSelect.addEventListener("change", draw);
    document.querySelectorAll("[data-focus]").forEach(btn => btn.addEventListener("click", () => {
      selectedId = btn.dataset.focus;
      draw();
      showDetail(graph.nodes.find(n => n.id === selectedId));
    }));

    function visibleGraph() {
      const q = searchInput.value.trim().toLowerCase();
      const rel = relationSelect.value;
      let nodes = graph.nodes.filter(n => activeLayers.has(n.layer));
      let nodeIds = new Set(nodes.map(n => n.id));
      let edges = graph.edges.filter(e => nodeIds.has(e.source) && nodeIds.has(e.target) && (!rel || e.relation === rel));
      if (q) {
        const direct = new Set(nodes.filter(n => (n.label + " " + n.summary + " " + n.position).toLowerCase().includes(q)).map(n => n.id));
        const neighbors = new Set(direct);
        edges.forEach(e => { if (direct.has(e.source)) neighbors.add(e.target); if (direct.has(e.target)) neighbors.add(e.source); });
        nodes = nodes.filter(n => neighbors.has(n.id));
        nodeIds = new Set(nodes.map(n => n.id));
        edges = edges.filter(e => nodeIds.has(e.source) && nodeIds.has(e.target));
      }
      return { nodes: nodes.map(d => ({...d})), edges: edges.map(d => ({...d})) };
    }

    function draw() {
      const width = area.clientWidth || 800;
      const height = Math.max(620, area.clientHeight || 720);
      svg.attr("viewBox", [0,0,width,height]);
      svg.selectAll("*").remove();
      const vg = visibleGraph();
      const layerX = d3.scalePoint().domain(Object.keys(graph.layers)).range([90, width - 90]);
      simulation?.stop();
      simulation = d3.forceSimulation(vg.nodes)
        .force("link", d3.forceLink(vg.edges).id(d => d.id).distance(d => d.relation === "competes_on" ? 120 : 88).strength(.34))
        .force("charge", d3.forceManyBody().strength(d => d.layer === "paper" ? -90 : -210))
        .force("x", d3.forceX(d => layerX(d.layer)).strength(.42))
        .force("y", d3.forceY(height / 2).strength(.08))
        .force("collision", d3.forceCollide().radius(d => radius(d) + 6));

      const zoomG = svg.append("g");
      svg.call(d3.zoom().scaleExtent([0.35, 3]).on("zoom", e => zoomG.attr("transform", e.transform)));

      const link = zoomG.append("g").selectAll("line").data(vg.edges).join("line")
        .attr("class", "link");
      const node = zoomG.append("g").selectAll("g").data(vg.nodes).join("g")
        .attr("class", d => "node" + (d.id === selectedId ? " selected" : ""))
        .call(drag(simulation))
        .on("click", (event, d) => { selectedId = d.id; showDetail(d); draw(); });
      node.append("circle")
        .attr("r", radius)
        .attr("fill", d => colors[d.layer] || "#777");
      node.append("text")
        .attr("x", d => radius(d) + 4)
        .attr("dy", ".32em")
        .text(d => d.label.length > 28 ? d.label.slice(0, 26) + "..." : d.label);

      simulation.on("tick", () => {
        link.attr("x1", d => d.source.x).attr("y1", d => d.source.y).attr("x2", d => d.target.x).attr("y2", d => d.target.y);
        node.attr("transform", d => `translate(${d.x},${d.y})`);
      });

      if (selectedId) {
        const connected = new Set([selectedId]);
        vg.edges.forEach(e => {
          const s = typeof e.source === "string" ? e.source : e.source.id;
          const t = typeof e.target === "string" ? e.target : e.target.id;
          if (s === selectedId) connected.add(t);
          if (t === selectedId) connected.add(s);
        });
        node.classed("faded", d => !connected.has(d.id));
        link.classed("faded", d => {
          const s = typeof d.source === "string" ? d.source : d.source.id;
          const t = typeof d.target === "string" ? d.target : d.target.id;
          return s !== selectedId && t !== selectedId;
        });
      }
    }

    function radius(d) {
      const mentions = +(d.metrics?.paper_mentions || d.metrics?.paper_count || 0);
      if (d.layer === "company") return 13;
      if (d.layer === "paper") return 5;
      return Math.max(6, Math.min(18, 6 + Math.sqrt(mentions) * 1.05));
    }

    function showDetail(d) {
      if (!d) return;
      const relations = graph.edges.filter(e => e.source === d.id || e.target === d.id).slice(0, 24);
      const relationHtml = relations.map(e => {
        const otherId = e.source === d.id ? e.target : e.source;
        const other = graph.nodes.find(n => n.id === otherId);
        return `<tr><td>${e.relation} → ${other ? other.label : otherId}</td><td>${e.confidence || ""}</td></tr>`;
      }).join("");
      const strengths = (d.strengths || []).map(x => `<span class="pill">${x}</span>`).join("");
      const risks = (d.risks || []).map(x => `<span class="pill">${x}</span>`).join("");
      const metrics = Object.entries(d.metrics || {}).filter(([,v]) => v !== "").map(([k,v]) => `<span class="pill">${k}: ${v}</span>`).join("");
      const sourceLink = d.url ? `<p><a href="${d.url}" target="_blank" rel="noreferrer">打开来源</a></p>` : "";
      detail.innerHTML = `
        <h2>${d.label}</h2>
        <p><strong>${d.layerLabel}</strong><br>${d.position}</p>
        <p>${d.summary || "暂无摘要。"}</p>
        ${metrics ? `<div class="section-title">指标</div><p>${metrics}</p>` : ""}
        ${strengths ? `<div class="section-title">优势</div><p>${strengths}</p>` : ""}
        ${risks ? `<div class="section-title">风险/反击点</div><p>${risks}</p>` : ""}
        ${sourceLink}
        <div class="section-title">相关关系</div>
        <table class="table-mini">${relationHtml || "<tr><td>无关系</td><td></td></tr>"}</table>
      `;
    }

    function drag(sim) {
      function started(event, d) { if (!event.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; }
      function dragged(event, d) { d.fx = event.x; d.fy = event.y; }
      function ended(event, d) { if (!event.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }
      return d3.drag().on("start", started).on("drag", dragged).on("end", ended);
    }

    window.addEventListener("resize", draw);
    draw();
  </script>
